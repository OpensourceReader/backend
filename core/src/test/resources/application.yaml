spring:
  datasource:
    url: jdbc:h2:mem:testdb;Mode=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

jwt:
  secretKey: "test"
  access-token-expiration: 600
  refresh-token-expiration: 604800 # 7일


logging:
  level:
    org.hibernate.SQL: debug